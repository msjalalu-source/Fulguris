<!DOCTYPE html>
<html xmlns=http://www.w3.org/1999/xhtml>

<head>
    <meta content=en-us http-equiv=Content-Language>
    <meta content='text/html; charset=utf-8' http-equiv=Content-Type>
    <meta name=viewport

    <title>
        ${TITLE}
    </title>
    <style>

    body {
        margin: 0;
        padding: 0 14px;
        background: ${colorBackground};
        font-family: Roboto, Arial, Helvetica, 'sans-serif';
    }

    .parent {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding-top: 52px;
        padding-bottom: 40px;
    }

    .calli {
        width: 56vw;
        max-width: 240px;
        height: auto;
    }

    .subtitle {
        margin-top: 8px;
        font-size: 14px;
        letter-spacing: 0.3px;
        color: ${colorOnBackground};
        opacity: 0.7;
        text-align: center;
    }

    .rule {
        margin: 26px 0 34px;
        width: 100%;
        max-width: 420px;
        height: 2px;
        background: linear-gradient(90deg, transparent, ${colorOnBackground}, transparent);
        opacity: 0.55;
    }

    #content {
        width: 100%;
        max-width: 420px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
    }

    .box {
        justify-self: center;
        width: 93%;
        aspect-ratio: 1 / 1;
        box-sizing: border-box;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 16px;
        color: #475569;
        font-size: 11px;
        overflow: hidden;
    }

    .ellipsis {
        width: 100%;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    a {
        text-decoration: none;
    }

    img {
        display: block;
        margin: 0 auto 4px;
        width: 34px;
        height: 34px;
        object-fit: contain;
    }
</style>

</head>
